name: Publicar no GitHub Pages

# Publicação manual: aba Actions > "Publicar no GitHub Pages" > Run workflow.
# Pré-requisitos, uma vez só, feitos pelo dono do repositório:
#   1. Settings > General > Default branch = main
#   2. Settings > Pages > Build and deployment > Source = GitHub Actions
# Só vai ao ar o que o app usa: index.html, css/ e js/. Testes, docs e
# configurações ficam de fora.
on:
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  publicar:
    name: Verificar e publicar
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Lint e testes (nada quebrado vai ao ar)
        run: npm run check
      - uses: actions/configure-pages@v5
      - name: Montar o site
        run: |
          mkdir _site
          cp -r index.html css js _site/
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - id: deployment
        uses: actions/deploy-pages@v4

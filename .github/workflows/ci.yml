name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    name: Lint, segurança e testes
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Estilo (ESLint)
        run: npm run lint
      - name: Segurança das dependências
        run: npm audit --audit-level=high
      - name: Testes
        run: npm test
      - name: Instalar o navegador do teste (Chromium)
        run: npx playwright install --with-deps chromium
      - name: Testes no navegador (E2E)
        run: npm run test:e2e
      - name: Guardar o relatório do teste se falhar
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: relatorio-e2e
          path: |
            playwright-report/
            test-results/
          retention-days: 7
